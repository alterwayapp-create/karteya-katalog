<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karteya Katalog</title>
<meta name="description" content="Karteya ürün kataloğu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap">
<style>
:root{--bg:#eef0f3;--surface:#ffffff;--ink:#1a1d21;--muted:#5b6570;--line:#d6dae0;--gold:#c9a24a;--shadow:0 1px 2px rgba(20,25,30,.08),0 8px 24px rgba(20,25,30,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--surface:#1f2429;--ink:#e8eaed;--muted:#9aa4ae;--line:#2f363d;--gold:#d8b45c;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo{font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;gap:10px}
.counter{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.counter b{color:var(--ink);font-weight:800}
.pdf{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--surface);background:var(--ink);text-decoration:none;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pdf:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.goldline{height:3px;background:linear-gradient(90deg,var(--gold),#e9d59a 50%,var(--gold))}
main{max-width:760px;margin:0 auto;padding:16px 12px 48px;display:flex;flex-direction:column;gap:18px}
.page{margin:0;background:var(--surface);box-shadow:var(--shadow);border-radius:4px;overflow:hidden;position:relative}
.page canvas{display:block;width:100%;height:auto;background:#fff}
figcaption{position:absolute;right:10px;bottom:10px;font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:600;color:#fff;background:rgba(26,29,33,.65);padding:3px 8px;border-radius:999px}
.msg{text-align:center;color:var(--muted);padding:64px 16px;font-weight:600}
.msg strong{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
.top{position:fixed;right:14px;bottom:14px;z-index:9;width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;font-size:18px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.top.show{opacity:1;pointer-events:auto}
.top:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="logo">Karteya</span><span class="sub">Ürün Kataloğu</span></div>
    <div class="right"><div class="counter" id="counter" hidden><b id="cur">1</b> / <span id="total"></span></div><a class="pdf" id="dl" href="katalog.pdf" download hidden>PDF</a></div>
  </div>
  <div class="goldline"></div>
</header>
<main id="main"><div class="msg" id="msg">Katalog yükleniyor…</div></main>
<button class="top" id="top" aria-label="Başa dön">↑</button>
<script src="lib/pdf.min.js"></script>
<script>
(function(){
  var main=document.getElementById('main'),msg=document.getElementById('msg'),cur=document.getElementById('cur'),total=document.getElementById('total'),counter=document.getElementById('counter'),dl=document.getElementById('dl'),top=document.getElementById('top');
  window.addEventListener('scroll',function(){top.classList.toggle('show',window.scrollY>800)},{passive:true});
  top.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
  function fail(t){msg.innerHTML='<strong>Katalog henüz yayında değil</strong>'+t;}
  if(!window.pdfjsLib){fail('Görüntüleyici yüklenemedi.');return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
  var url='katalog.pdf?v='+Date.now();
  pdfjsLib.getDocument({url:url}).promise.then(function(pdf){
    msg.remove();counter.hidden=false;dl.hidden=false;total.textContent=pdf.numPages;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var figs=[];
    pdf.getPage(1).then(function(p1){
      var vp=p1.getViewport({scale:1});var ratio=vp.height/vp.width;
      for(var i=1;i<=pdf.numPages;i++){
        var fig=document.createElement('figure');fig.className='page';fig.dataset.n=i;fig.id='p'+i;
        var c=document.createElement('canvas');c.style.aspectRatio=vp.width+' / '+vp.height;
        var cap=document.createElement('figcaption');cap.textContent=i+' / '+pdf.numPages;
        fig.appendChild(c);fig.appendChild(cap);main.appendChild(fig);figs.push(fig);
      }
      var rendered={};
      function render(fig){var n=+fig.dataset.n;if(rendered[n])return;rendered[n]=true;
        pdf.getPage(n).then(function(page){var c=fig.querySelector('canvas');var w=fig.clientWidth||600;var scale=(w*dpr)/page.getViewport({scale:1}).width;var v=page.getViewport({scale:scale});c.width=v.width;c.height=v.height;page.render({canvasContext:c.getContext('2d'),viewport:v});});}
      var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)render(e.target)})},{rootMargin:'150% 0px'});
      var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)cur.textContent=e.target.dataset.n})},{rootMargin:'-45% 0px -45% 0px'});
      figs.forEach(function(f){io.observe(f);io2.observe(f)});
    });
  }).catch(function(e){fail('Katalog dosyası (katalog.pdf) bulunamadı. Lütfen daha sonra tekrar deneyin.');});
})();
</script>
</body>
</html>
